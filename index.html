<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAP Jobs USA & Canada</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .job { border-bottom: 1px solid #ccc; padding: 10px; }
    a { text-decoration: none; color: #007BFF; }
  </style>
</head>
<body>

<h1>SAP Jobs USA & Canada</h1>
<div id="jobs"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- REPLACE WITH YOUR SUPABASE URL & KEY ---
const SUPABASE_URL = "https://ppgzcywiodxuuxysbnzl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZ3pjeXdpb2R4dXV4eXNibnpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MDk0MDYsImV4cCI6MjA4ODQ4NTQwNn0.pebMyucQZKd3q3ypyeAxeG1ZP34OnXJwI0NVgp63jbI";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadJobs() {
  const { data, error } = await supabase
    .from("jobs")
    .select("id, title, company, location")
    .order("created_at", { ascending: false });

  if(error){ console.error(error); return; }

  const container = document.getElementById("jobs");
  data.forEach(job => {
    const div = document.createElement("div");
    div.className = "job";
    div.innerHTML = `
      <h3><a href="job.html?id=${job.id}">${job.title}</a></h3>
      <p>Company: ${job.company}</p>
      <p>Location: ${job.location}</p>
    `;
    container.appendChild(div);
  });
}

loadJobs();
console.log(data);
</script>
</body>
</html>
