<!DOCTYPE html>
<html>

<head>
  <title>SAP Jobs USA & Canada</title>
</head>

<body>

<h1>SAP Jobs USA & Canada</h1>

<div id="jobs"></div>

<div id="applyForm" style="display:none">

<h2>Apply for Job</h2>

<input id="name" placeholder="Your Name"><br><br>

<input id="email" placeholder="Email"><br><br>

<input id="resume" type="file"><br><br>

<button onclick="submitApplication()">Submit Application</button>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabaseUrl = "https://ppgzcywiodxuuxysbnzl.supabase.co"
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZ3pjeXdpb2R4dXV4eXNibnpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MDk0MDYsImV4cCI6MjA4ODQ4NTQwNn0.pebMyucQZKd3q3ypyeAxeG1ZP34OnXJwI0NVgp63jbI"

const supabase = createClient(supabaseUrl, supabaseKey)

let selectedJobId = ""
let selectedJobTitle = ""

async function loadJobs(){

  const { data, error } = await supabase
    .from("jobs")
    .select("*")

  const container = document.getElementById("jobs")

  data.forEach(job => {

    const div = document.createElement("div")

    div.innerHTML = `
      <h3>
        <a href="job.html?id=${job.id}">
          ${job.title}
        </a>
      </h3>

      <p>Company: ${job.company}</p>
      <p>Location: ${job.location}</p>
      <p>Salary: ${job.salary}</p>

      <button onclick="showApplyForm('${job.id}','${job.title}')">
        Apply
      </button>

      <hr>
    `

    container.appendChild(div)

  })

}

loadJobs()

window.showApplyForm = function(jobId,jobTitle){

  selectedJobId = jobId
  selectedJobTitle = jobTitle

  document.getElementById("applyForm").style.display = "block"

}

window.submitApplication = async function(){

  const name = document.getElementById("name").value
  const email = document.getElementById("email").value
  const file = document.getElementById("resume").files[0]

  const fileName = Date.now() + "-" + file.name

  const { error: uploadError } =
    await supabase.storage
      .from("resumes")
      .upload(fileName,file)

  if(uploadError){
    alert("Resume upload failed")
    return
  }

  const resumeUrl =
    supabaseUrl + "/storage/v1/object/public/resumes/" + fileName

  const { error } = await supabase
    .from("applications")
    .insert([
      {
        name:name,
        email:email,
        job_id:selectedJobId,
        job_title:selectedJobTitle,
        resume_url:resumeUrl
      }
    ])

  if(error){
    alert("Error submitting application")
  }
  else{
    alert("Application submitted successfully!")
  }

}

</script>

</body>

</html>
