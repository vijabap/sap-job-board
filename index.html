<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabaseUrl = "https://ppgzcywiodxuuxysbnzl.supabase.co"
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZ3pjeXdpb2R4dXV4eXNibnpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MDk0MDYsImV4cCI6MjA4ODQ4NTQwNn0.pebMyucQZKd3q3ypyeAxeG1ZP34OnXJwI0NVgp63jbI" // ⚠️ must be ANON key (not service key)

const supabase = createClient(supabaseUrl, supabaseKey)

async function loadJobs() {

  const { data, error } = await supabase
    .from("jobs")
    .select("*")
    .order("created_at", { ascending: false })

  console.log("Jobs from DB:", data)

  const container = document.getElementById("jobs")
  container.innerHTML = ""

  if (!data || data.length === 0) {
    container.innerHTML = "<p>No jobs found</p>"
    return
  }

  data.forEach(job => {

    const div = document.createElement("div")

    div.innerHTML = `
      <h3>${job.title}</h3>
      <p>${job.company}</p>
      <p>${job.location}</p>

      <a href="job.html?id=${job.id}">
        <button>View Details</button>
      </a>

      <hr>
    `

    container.appendChild(div)

  })
}

loadJobs()

</script>
